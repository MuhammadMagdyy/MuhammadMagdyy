name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight
  workflow_dispatch:     # Allows you to trigger it manually from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
      packages: read

    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@v3.33  # Changed to v3.33 to completely bypass the glitched GitHub cache
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core Configuration
          user: MuhammadMagdyy   
          template: classic
          filename: github-metrics.svg
          output_action: commit
          
          # Base metrics displayed at the top
          base: header, activity, community, repositories
          
          # Active Plugins
          plugin_languages: yes
          plugin_habits: yes
          plugin_achievements: yes
