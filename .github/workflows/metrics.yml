name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight
  workflow_dispatch:     # Allows you to trigger it manually from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
      packages: read

    steps:
      # We use actions/checkout just to give the runner context of your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Metrics SVG
        # Using the pre-built Docker image container bypasses GitHub's glitched tar.gz download servers
        uses: docker://ghcr.io/lowlighter/metrics:master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core Configuration
          user: MuhammadMagdyy   
          template: classic
          filename: github-metrics.svg
          output_action: commit
          
          # Base metrics displayed at the top
          base: header, activity, community, repositories
          
          # Active Plugins
          plugin_languages: yes
          plugin_habits: yes
          plugin_achievements: yes
